name: linux-openvpn

on: [push]

jobs:
  Build-OpenVPN-Linux:
    name: 'Build-OpenVPN-Ubuntu'
    runs-on: ubuntu-24.04
    if: |
      contains(github.event.head_commit.message, '[all]') ||
      contains(github.event.head_commit.message, '[linux]') ||
      contains(github.event.head_commit.message, '[linux-openvpn]') ||
      contains(github.event.head_commit.message, '[openvpn]')

    strategy:
      matrix:
        # TODO: Restore all architectures after ARM64 testing is complete
        # Original: arch: [x86_64, arm64] #, x86, arm32]
        arch: [arm64]  # Temporarily ARM64 only for testing
      fail-fast: false

    env:
      CFLAGS: "-static-libgcc -g -O1"
      UBSAN_OPTIONS: print_stacktrace=1
      BUILD_DIR: ${{ github.workspace }}/../_deps/openvpn_build
      INSTALL_DIR: ${{ github.workspace }}/../openvpn_inst
      OPEN_SSL_VER: "3.0.13"
      _ARCH: ${{matrix.arch}}
      OPENSSL_LIBS: "-L${INSTALL_DIR}/lib -lssl -lcrypto"
      OPENSSL_CFLAGS: "-I${INSTALL_DIR}/include"
      LZO_LIBS: "-L${INSTALL_DIR}/lib -llzo2"
      LZO_CFLAGS: "-I${INSTALL_DIR}/include"
      LZ4_LIBS: "-L${INSTALL_DIR}/lib -llz4"
      LZ4_CFLAGS: "-I${INSTALL_DIR}/include"
    steps:


      - name: Set up build environment
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.arch == 'x86_64'
        with:
          packages: gcc-multilib g++-multilib libnl-genl-3-dev libcap-ng-dev libpam0g-dev
          version: 1.0

      - name: Set up build environment for ARM64
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.arch == 'arm64'
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libnl-genl-3-dev libcap-ng-dev libpam0g-dev
          version: 1.0

      - name: Creating work-folder
        run: |
          mkdir -pv ${BUILD_DIR}
          mkdir -pv ${INSTALL_DIR}
          mkdir -pv ${INSTALL_DIR}/include
          mkdir -pv ${INSTALL_DIR}/lib
      
      - name: Build OpenSSL
        run: |
          cd ${BUILD_DIR}
          curl -L https://www.openssl.org/source/openssl-${OPEN_SSL_VER}.tar.gz | tar zx
          cd ${BUILD_DIR}/openssl-${OPEN_SSL_VER}
          case "${{ matrix.arch }}" in
            x86_64)
              ./Configure no-tests linux-x86_64 enable-ec_nistp_64_gcc_128 no-ssl2 no-ssl3 no-comp -static-libgcc --openssldir=/usr/local/lib
              ;;
            arm64)
              ./Configure no-tests linux-aarch64 no-ssl2 no-ssl3 no-comp -static-libgcc --openssldir=/usr/local/lib --cross-compile-prefix=aarch64-linux-gnu-
              ;;
          esac
          echo "************************************************"
          echo "******** Compiling OpenSSL..."
          echo "************************************************"
          make
          echo "************************************************"
          echo "******** Copying OpenSSL include folder and static libraries..."
          # if you want to use OS-default SHARED openssl libraries - not necessary to compile it.
          # Just copy required headers of OpenSSL (include folder)
          cp -r ${BUILD_DIR}/openssl-${OPEN_SSL_VER}/include/openssl ${INSTALL_DIR}/include/
          # if you want to use OS-default SHARED openssl libraries - skip copying this static libraries
          cp ${BUILD_DIR}/openssl-${OPEN_SSL_VER}/libcrypto.a ${INSTALL_DIR}/lib/
          cp ${BUILD_DIR}/openssl-${OPEN_SSL_VER}/libssl.a ${INSTALL_DIR}/lib/
      - name: Build LZO
        run: |
          echo "************************************************"
          echo "******** Downloading LZO sources..."
          echo "************************************************"
          cd ${BUILD_DIR}
          curl -L https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz | tar zx
          cd lzo-2.10
          echo "************************************************"
          echo "******** Compiling LZO..."
          echo "************************************************"
          case "${{ matrix.arch }}" in
            x86_64)
              ./configure --prefix="${INSTALL_DIR}" && make && make install
              ;;
            arm64)
              ./configure --host=aarch64-linux-gnu --prefix="${INSTALL_DIR}" CC=aarch64-linux-gnu-gcc && make && make install
              ;;
          esac 
      - name: Build LZ4
        run: |
          cd ${BUILD_DIR}
          git clone https://github.com/lz4/lz4
          cd lz4
          git checkout release
          case "${{ matrix.arch }}" in
            x86_64)
              sudo make install PREFIX="${INSTALL_DIR}"
              ;;
            arm64)
              sudo make install PREFIX="${INSTALL_DIR}" CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar
              ;;
          esac
          cd ${INSTALL_DIR}/lib
          sudo rm -f *.so *.so.*
      - name: 'Get openvpn'
        uses: actions/checkout@v3
        with:
          repository: OpenVPN/openvpn
          ref: release/2.5
          path: openvpn

      - name: autoconf
        working-directory: openvpn
        run: autoreconf -fvi
      - name: configure
        working-directory: openvpn
        run: |
          case "${{ matrix.arch }}" in
            x86_64)
              OPENSSL_LIBS="${INSTALL_DIR}/lib/libssl.a ${INSTALL_DIR}/lib/libcrypto.a -lpthread -ldl" OPENSSL_CFLAGS="-I${INSTALL_DIR}/include" LZO_LIBS="-L${INSTALL_DIR}/lib -llzo2" LZO_CFLAGS="-I${INSTALL_DIR}/include" LZ4_LIBS="-L${INSTALL_DIR}/lib -llz4" LZ4_CFLAGS="-I${INSTALL_DIR}/include" ./configure --disable-debug --enable-static=yes --enable-shared=no --disable-dependency-tracking --disable-dco --disable-plugin-auth-pam --disable-plugins --disable-silent-rules --with-crypto-library=openssl
              ;;
            arm64)
              OPENSSL_LIBS="${INSTALL_DIR}/lib/libssl.a ${INSTALL_DIR}/lib/libcrypto.a -lpthread -ldl" OPENSSL_CFLAGS="-I${INSTALL_DIR}/include" LZO_LIBS="-L${INSTALL_DIR}/lib -llzo2" LZO_CFLAGS="-I${INSTALL_DIR}/include" LZ4_LIBS="-L${INSTALL_DIR}/lib -llz4" LZ4_CFLAGS="-I${INSTALL_DIR}/include" ./configure --host=aarch64-linux-gnu --disable-debug --enable-static=yes --enable-shared=no --disable-dependency-tracking --disable-dco --disable-plugin-auth-pam --disable-plugins --disable-silent-rules --with-crypto-library=openssl
              ;;
          esac
      - name: make all
        working-directory: openvpn
        run: make -j4 
#      - name: make check
#        working-directory: openvpn
#        run: make check
      - name: copy libs
        working-directory: openvpn
        run: |
          mkdir buildOvpn
          mkdir buildOvpn/${{matrix.arch}}
          cp src/openvpn/openvpn buildOvpn/${{matrix.arch}}/openvpn
      
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-linux
          path: openvpn/buildOvpn/* 

  Build-OpenVPN3-Linux:
    name: 'Build-OpenVPN3-Ubuntu'
    runs-on: ubuntu-24.04

    if: |
      contains(github.event.head_commit.message, '[all]') ||
      contains(github.event.head_commit.message, '[linux]') ||
      contains(github.event.head_commit.message, '[linux-openvpn]') ||
      contains(github.event.head_commit.message, '[openvpn]')

    strategy:
      matrix:
        # TODO: Restore all architectures after ARM64 testing is complete
        # Original: arch: [x86_64, arm64] #, x86, arm32]
        arch: [arm64]  # Temporarily ARM64 only for testing
      fail-fast: false

    env:
      O3: "${{ github.workspace }}/O3"
      DEP_DIR: "${{ github.workspace }}/O3/deps"
      DL: "${{ github.workspace }}/O3/dl"
      CFLAGS: "-static-libgcc -g -O1 -ldl"
      OPEN_SSL_VER: "1.1.1t"     

    steps:
      - name: Set up build environment
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.arch == 'x86_64'
        with:
          packages: g++ make libmbedtls-dev libssl-dev liblz4-dev cmake gcc-multilib g++-multilib libnl-genl-3-dev libcap-ng-dev libpam0g-dev
          version: 1.0

      - name: Set up build environment for ARM64
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.arch == 'arm64'
        with:
          packages: g++ make libmbedtls-dev libssl-dev liblz4-dev cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libnl-genl-3-dev libcap-ng-dev libpam0g-dev
          version: 1.0

      - name: Creating work-folder
        run: |
          mkdir -pv ${{env.O3}}
          mkdir -pv ${{env.DEP_DIR}}
          mkdir -pv ${{env.DL}}

      - name: 'Get openvpn'
        uses: actions/checkout@v3
        with:
          repository: amnezia-vpn/openvpn3
          ref: win-amezia
          path: ${{env.O3}}/core

      - name: 'Build dependencies'
        working-directory: ${{env.O3}}
        run: |
          export MTLS=0
          cd core/scripts/linux/
          ./build-all

      - name: Rebuild LZ4 for ARM64
        if: matrix.arch == 'arm64'
        run: |
          echo "************************************************"
          echo "******** Rebuilding LZ4 for ARM64..."
          echo "************************************************"
          cd ${{env.DEP_DIR}}/lz4
          make clean
          sudo make install PREFIX=${{env.DEP_DIR}}/lz4 CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar
          cd ${{env.DEP_DIR}}/lz4/lib
          sudo rm -f *.so *.so.*

      - name: Build OpenSSL
        run: |
          curl -L https://www.openssl.org/source/openssl-${OPEN_SSL_VER}.tar.gz | tar zx
          cd openssl-${OPEN_SSL_VER}
          case "${{ matrix.arch }}" in
            x86_64)
              ./Configure no-shared no-tests linux-x86_64 enable-ec_nistp_64_gcc_128 no-ssl2 no-ssl3 no-comp -static-libgcc --openssldir=/usr/local/lib
              ;;
            arm64)
              ./Configure no-shared no-tests linux-aarch64 no-ssl2 no-ssl3 no-comp -static-libgcc --openssldir=/usr/local/lib --cross-compile-prefix=aarch64-linux-gnu-
              ;;
          esac
          echo "************************************************"
          echo "******** Compiling OpenSSL..."
          echo "************************************************"
          make
          echo "************************************************"
          echo "******** Copying OpenSSL include folder and static libraries..."
          # if you want to use OS-default SHARED openssl libraries - not necessary to compile it.
          # Just copy required headers of OpenSSL (include folder)
          sudo make install

      - name: 'Get Cloak for plugin'
        if: matrix.arch == 'arm64'
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/Cloak
          ref: master-amnezia
          path: Cloak

      - name: 'Build Cloak plugin for ARM64'
        if: matrix.arch == 'arm64'
        working-directory: Cloak
        run: |
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS="linux" GOARCH="arm64" go build -v -o ck-ovpn-plugin.a -buildmode=c-archive ./cmd/ck-ovpn-plugin/
          cp ck-ovpn-plugin.a ${{env.O3}}/core/openvpn/plugin/linux/

      - name: 'Build the OpenVPN 3 client wrapper'
        working-directory: ${{env.O3}}
        run: |
          cd ${{env.O3}}/core
          cp -rf openvpn/plugin/linux/ck-ovpn-plugin.h openvpn/transport/client/pluggable/ck-ovpn-plugin.h
          mkdir build && cd build
          case "${{ matrix.arch }}" in
            x86_64)
              cmake -DOPENSSL_ROOT_DIR=${{ github.workspace }}/openssl-${OPEN_SSL_VER} -DCMAKE_EXE_LINKER_FLAGS="-ldl -static-libgcc -static " ..
              ;;
            arm64)
              cmake -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_AR=/usr/bin/aarch64-linux-gnu-ar \
                -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
                -DCMAKE_C_FLAGS="-fno-lto" -DCMAKE_CXX_FLAGS="-fno-lto" \
                -DOPENSSL_ROOT_DIR=${{ github.workspace }}/openssl-${OPEN_SSL_VER} \
                -DCMAKE_EXE_LINKER_FLAGS="-ldl -static-libgcc -static -fno-lto" ..
              ;;
          esac
          cmake --build . --config Release --target ovpncli

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn3-linux
          path: ${{env.O3}}/core/build/test


  github-release:
    name: GitHub Release
    needs: Build-OpenVPN-Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Artifacts
        uses: actions/download-artifact@v4

      - name: Setup | Checksums
        run: for file in $(find ./ -name 'o*' ); do openssl dgst -sha256 -r "$file" | awk '{print $1}' > "${file}.sha256"; done

      - name: Zip ALL
        run: for file in *; do zip -r ${file%.*}.zip  $file; done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: openvpn-linux.zip
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true  
      
  ovpn3-release:
    name: GitHub Release
    needs: Build-OpenVPN3-Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Artifacts
        uses: actions/download-artifact@v4

      - name: Setup | Checksums
        run: for file in $(find ./ -name 'o*' ); do openssl dgst -sha256 -r "$file" | awk '{print $1}' > "${file}.sha256"; done

      - name: Zip ALL
        run: for file in *; do zip -r ${file%.*}.zip  $file; done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: openvpn3-linux.zip
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true 

